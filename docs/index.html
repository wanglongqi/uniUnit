<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uniUnit - Complete Unit System Converter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	min-height: 100vh;
	padding: 20px;
}
.container { max-width: 1024px; margin: 0 auto; }
header { text-align: center; color: white; margin-bottom: 30px; }
header h1 { font-size: 2.5em; margin-bottom: 10px; }
.offline-badge { background: #28a745; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-left: 10px; }
.card {
	background: white;
	border-radius: 16px;
	padding: 24px;
	margin-bottom: 20px;
	box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.card h2 { color: #333; margin-bottom: 20px; font-size: 1.3em; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
.form-group { margin-bottom: 16px; position: relative; }
label { display: block; margin-bottom: 6px; color: #555; font-weight: 500; }
input, select, textarea {
	width: 100%;
	padding: 12px;
	border: 2px solid #e0e0e0;
	border-radius: 8px;
	font-size: 16px;
}
input:focus, select:focus { outline: none; border-color: #667eea; }
.autocomplete-list {
	position: absolute;
	top: 100%;
	left: 0;
	right: 0;
	background: white;
	border: 2px solid #667eea;
	border-top: none;
	border-radius: 0 0 8px 8px;
	max-height: 200px;
	overflow-y: auto;
	z-index: 1000;
	display: none;
}
.autocomplete-item {
	padding: 10px 12px;
	cursor: pointer;
	border-bottom: 1px solid #eee;
}
.autocomplete-item:hover { background: #f0f4ff; }
.autocomplete-item:last-child { border-bottom: none; }
.row { display: flex; gap: 16px; margin-bottom: 16px; }
.col { flex: 1; }
button {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	color: white;
	border: none;
	padding: 14px 28px;
	border-radius: 8px;
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
	width: 100%;
}
button:hover { opacity: 0.9; }
.result {
	margin-top: 16px;
	padding: 16px;
	background: #f8f9ff;
	border-radius: 8px;
	border-left: 4px solid #667eea;
}
.result.error { background: #fff5f5; border-left-color: #e53e3e; color: #c53030; }
.success { color: #28a745; }
.tabs-container { display: flex; gap: 30px; }
.tabs-sidebar { display: flex; flex-direction: column; gap: 10px; min-width: 180px; }
.tab-btn {
	background: #f0f0f0;
	color: #666;
	padding: 12px 20px;
	border-radius: 8px;
	cursor: pointer;
	border: none;
	font-size: 14px;
	text-align: left;
}
.tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
@media (max-width: 768px) {
	.tabs-container { flex-direction: column; }
	.tabs-sidebar { flex-direction: row; min-width: auto; }
	.tab-btn { text-align: center; }
	.row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container">
<header>
	<h1>uniUnit <span class="offline-badge">Powered by math.js</span></h1>
	<p>Complete Unit System Converter | 完整单位系统转换器</p>
</header>

<div class="tabs-container">
	<div class="tabs-sidebar">
		<button class="tab-btn active" onclick="showTab('simple')">Simple Convert</button>
		<button class="tab-btn" onclick="showTab('system')">Unit System</button>
		<button class="tab-btn" onclick="showTab('presets')">Presets</button>
		<button class="tab-btn" onclick="showTab('tests')">Run Tests</button>
	</div>

	<div class="tab-main">
		<!-- Simple Conversion -->
		<div id="simple" class="tab-content active">
			<div class="card">
				<h2>Simple Unit Conversion</h2>
				<div class="form-group">
					<label>Value</label>
					<input type="number" id="simpleValue" value="1">
				</div>
				<div class="row">
					<div class="col">
						<div class="form-group">
							<label>From Unit</label>
							<input type="text" id="simpleFrom" value="km" autocomplete="off">
							<div class="autocomplete-list" id="autocompleteFrom"></div>
						</div>
					</div>
					<div class="col">
						<div class="form-group">
							<label>To Unit</label>
							<input type="text" id="simpleTo" value="m" autocomplete="off">
							<div class="autocomplete-list" id="autocompleteTo"></div>
						</div>
					</div>
				</div>
				<button onclick="simpleConvert()">Convert</button>
				<div id="simpleResult" class="result" style="display:none;"></div>
			</div>
		</div>

		<!-- Unit System Conversion -->
		<div id="system" class="tab-content">
			<div class="card">
				<h2>Unit System Conversion</h2>
				<div class="form-group">
					<label>Value with Units (e.g., "100 N")</label>
					<input type="text" id="systemValue" value="100 N">
				</div>
				<div class="form-group">
					<label>Target System (JSON format)</label>
					<textarea id="systemUnits" rows="3">{"kg": "kg", "m": "mm", "s": "ms"}</textarea>
				</div>
				<button onclick="systemConvert()">Convert</button>
				<div id="systemResult" class="result" style="display:none;"></div>
			</div>
		</div>

		<!-- Presets Conversion -->
		<div id="presets" class="tab-content">
			<div class="card">
				<h2>Preset Systems Quick Convert</h2>
				<div class="form-group">
					<label>Value (e.g., "100 kg")</label>
					<input type="text" id="presetValue" value="100 kg">
				</div>
				<div class="row">
					<div class="col">
						<div class="form-group">
							<label>From System</label>
							<select id="presetFrom">
								<option value="SI">SI</option>
								<option value="CGS">CGS</option>
								<option value="mmkgms">mmkgms</option>
								<option value="mmgms">mmgms</option>
								<option value="Imperial">Imperial</option>
								<option value="FPS">FPS</option>
							</select>
						</div>
					</div>
					<div class="col">
						<div class="form-group">
							<label>To System</label>
							<select id="presetTo">
								<option value="mmkgms">mmkgms</option>
								<option value="CGS">CGS</option>
								<option value="SI">SI</option>
								<option value="mmgms">mmgms</option>
								<option value="Imperial">Imperial</option>
								<option value="FPS">FPS</option>
							</select>
						</div>
					</div>
				</div>
				<button onclick="presetConvert()">Convert</button>
				<div id="presetResult" class="result" style="display:none;"></div>
			</div>
		</div>

		<!-- Test Suite -->
		<div id="tests" class="tab-content">
			<div class="card">
				<h2>Test Suite (Verify Python Alignment)</h2>
				<button onclick="runTests()">Run All Tests</button>
				<div id="testResult" class="result" style="display:none;"></div>
			</div>
		</div>
	</div>
</div>
</div>

<!-- Load math.js locally for offline use -->
<script src="node_modules/mathjs/lib/browser/math.js"></script>
<script>
const ALL_UNITS = [
	'm', 'meter', 'km', 'kilometer', 'cm', 'centimeter', 'mm', 'millimeter', 'um', 'micrometer', 'nm', 'nanometer', 'in', 'inch', 'ft', 'foot', 'yd', 'yard', 'mi', 'mile',
	'kg', 'kilogram', 'g', 'gram', 'mg', 'milligram', 'ug', 'microgram', 'lb', 'pound', 'oz', 'ounce', 'ton',
	's', 'second', 'ms', 'millisecond', 'us', 'microsecond', 'ns', 'nanosecond', 'min', 'minute', 'h', 'hour', 'd', 'day', 'yr', 'year',
	'N', 'newton', 'kN', 'kilonewton', 'dyn', 'dyne', 'lbf',
	'Pa', 'pascal', 'kPa', 'MPa', 'GPa', 'bar', 'atm', 'psi', 'mmHg',
	'J', 'joule', 'kJ', 'MJ', 'cal', 'kcal', 'eV', 'erg', 'BTU',
	'W', 'watt', 'kW', 'MW', 'hp', 'horsepower',
	'V', 'volt', 'kV', 'mV', 'A', 'ampere', 'mA', 'kA', 'ohm', 'kohm', 'F', 'farad', 'H', 'henry',
	'Hz', 'hertz', 'kHz', 'MHz', 'GHz', 'rad/s', 'rpm',
	'm/s', 'km/h', 'mph', 'kn', 'knot', 'c',
	'm/s^2', 'g', 'grav',
	'kg/m^3', 'g/cm^3', 'lb/ft^3',
	'N*m', 'N*m', 'ft*lbf',
	'K', 'C', 'celsius', 'F', 'fahrenheit', 'R', 'rankine',
	'mol', 'mole', 'mmol', 'kmol',
	'cd', 'candela', 'lm', 'lumen', 'lx', 'lux',
	'rad', 'radian', 'deg', 'degree', 'grad', 'gradian', 'sr', 'steradian'
];

function setupAutocomplete(inputId, listId) {
	const input = document.getElementById(inputId);
	const list = document.getElementById(listId);
	
	input.addEventListener('input', function() {
		const val = this.value.toLowerCase();
		if (!val) { list.style.display = 'none'; return; }
		
		const matches = ALL_UNITS.filter(u => u.toLowerCase().startsWith(val)).slice(0, 10);
		if (matches.length === 0) { list.style.display = 'none'; return; }
		
		list.innerHTML = matches.map(u => `<div class="autocomplete-item">${u}</div>`).join('');
		list.style.display = 'block';
		
		list.querySelectorAll('.autocomplete-item').forEach(item => {
			item.addEventListener('click', function() {
				input.value = this.textContent;
				list.style.display = 'none';
			});
		});
	});
	
	input.addEventListener('blur', () => setTimeout(() => list.style.display = 'none', 200));
}

setupAutocomplete('simpleFrom', 'autocompleteFrom');
setupAutocomplete('simpleTo', 'autocompleteTo');

class UniUnitSystem {
	constructor(unitsDict) {
		this.unitsDict = this.normalizeDict(unitsDict);
	}

	normalizeDict(dict) {
		const aliases = {
			'kilogram': 'kg', 'gram': 'g', 'meter': 'm', 'millimeter': 'mm',
			'centimeter': 'cm', 'kilometer': 'km', 'second': 's', 'millisecond': 'ms',
			'minute': 'min', 'hour': 'h'
		};

		const result = {};
		for (const [k, v] of Object.entries(dict)) {
			const nk = (aliases[k.toLowerCase()] || k).toLowerCase();
			const nv = (aliases[v.toLowerCase()] || v).toLowerCase();
			result[nk] = nv;
		}
		return result;
	}

	convert(input) {
		const match = input.trim().match(/^([\d.+-]+(?:[eE][+-]?\d+)?)\s+(.+)$/);
		if (!match) throw new Error('Invalid format. Use: "100 N"');

		const value = parseFloat(match[1]);
		const unitStr = match[2].trim();

		const unit = math.unit(value, unitStr);
		const dims = unit.dimensions;
		const dimNames = ['mass', 'length', 'time', 'current', 'temperature', 'amount', 'luminous', 'angle', 'solid_angle'];

		const dimMap = {};
		for (let i = 0; i < dims.length; i++) {
			if (dims[i] !== 0) dimMap[dimNames[i]] = dims[i];
		}

		const targetUnits = {
			mass: this.unitsDict['kg'] || 'kg',
			length: this.unitsDict['m'] || 'm',
			time: this.unitsDict['s'] || 's',
			current: this.unitsDict['a'] || 'A',
			temperature: this.unitsDict['k'] || 'K',
			amount: this.unitsDict['mol'] || 'mol',
			luminous: this.unitsDict['cd'] || 'cd'
		};

		const numerators = [], denominators = [];
		for (const [dim, exp] of Object.entries(dimMap)) {
			const tu = targetUnits[dim];
			if (!tu) continue;
			if (exp === 1) numerators.push(tu);
			else if (exp === -1) denominators.push(tu);
			else if (exp > 0) numerators.push(`${tu}^${exp}`);
			else denominators.push(`${tu}^${-exp}`);
		}

		let targetUnitStr = numerators.join('*');
		if (denominators.length > 0) targetUnitStr += '/' + denominators.join('*');

		let factor = 1;
		const siUnits = {mass: 'kg', length: 'm', time: 's', current: 'A', temperature: 'K', amount: 'mol', luminous: 'cd'};

		for (const [dim, exp] of Object.entries(dimMap)) {
			const siUnit = siUnits[dim];
			const targetUnit = targetUnits[dim];
			if (!siUnit || !targetUnit) continue;

			const siToBase = this.getUnitFactor(siUnit);
			const targetToBase = this.getUnitFactor(targetUnit);
			const dimFactor = siToBase / targetToBase;
			factor *= Math.pow(dimFactor, exp);
		}

		const resultValue = value * factor;
		return { value: resultValue, unit: targetUnitStr, magnitude: resultValue, units: targetUnitStr, toString: () => `${resultValue} ${targetUnitStr}` };
	}

	getUnitFactor(unit) {
		const factors = {
			'kg': 1, 'g': 0.001, 'mg': 0.000001, 'lb': 0.453592,
			'm': 1, 'mm': 0.001, 'cm': 0.01, 'km': 1000, 'in': 0.0254, 'ft': 0.3048,
			's': 1, 'ms': 0.001, 'min': 60, 'h': 3600,
			'a': 1, 'ma': 0.001, 'ka': 1000,
			'k': 1, 'mol': 1, 'mmol': 0.001, 'cd': 1
		};
		return factors[unit.toLowerCase()] || 1;
	}
}

const PRESETS = {
	SI: {kg: 'kg', m: 'm', s: 's'},
	MKS: {kg: 'kg', m: 'm', s: 's'},
	CGS: {kg: 'g', m: 'cm', s: 's'},
	mmkgms: {kg: 'kg', m: 'mm', s: 'ms'},
	mmgms: {kg: 'g', m: 'mm', s: 'ms'},
	nm_ug_ps: {kg: 'ug', m: 'nm', s: 'ps'},
	Imperial: {kg: 'lb', m: 'in', s: 's'},
	FPS: {kg: 'lb', m: 'ft', s: 's'}
};

function quickConvert(input, fromSystem, toSystem) {
	if (fromSystem === toSystem) return { value: input, unit: '', toString: () => input };
	const toPreset = PRESETS[toSystem];
	if (!toPreset) throw new Error(`Unknown system: ${toSystem}`);
	const converter = new UniUnitSystem(toPreset);
	return converter.convert(input);
}

function showTab(tabId) {
	document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
	document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
	document.getElementById(tabId).classList.add('active');
	event.target.classList.add('active');
}

function formatNum(n) {
	if (Math.abs(n) < 0.001 || Math.abs(n) > 10000) return n.toExponential(6);
	return n.toPrecision(6);
}

function simpleConvert() {
	const value = parseFloat(document.getElementById('simpleValue').value);
	const from = document.getElementById('simpleFrom').value;
	const to = document.getElementById('simpleTo').value;
	const resultDiv = document.getElementById('simpleResult');

	try {
		const unit = math.unit(value, from);
		const converted = unit.to(to);
		resultDiv.className = 'result';
		resultDiv.innerHTML = `<span class="success">✓</span> ${value} ${from} = ${formatNum(converted.value)} ${to}`;
		resultDiv.style.display = 'block';
	} catch (e) {
		resultDiv.className = 'result error';
		resultDiv.innerHTML = `Error: ${e.message}`;
		resultDiv.style.display = 'block';
	}
}

function systemConvert() {
	const value = document.getElementById('systemValue').value;
	const unitsStr = document.getElementById('systemUnits').value;
	const resultDiv = document.getElementById('systemResult');

	try {
		const units = JSON.parse(unitsStr);
		const converter = new UniUnitSystem(units);
		const result = converter.convert(value);
		resultDiv.className = 'result';
		resultDiv.innerHTML = `<span class="success">✓</span> ${value} → ${result.toString()}`;
		resultDiv.style.display = 'block';
	} catch (e) {
		resultDiv.className = 'result error';
		resultDiv.innerHTML = `Error: ${e.message}`;
		resultDiv.style.display = 'block';
	}
}

function presetConvert() {
	const value = document.getElementById('presetValue').value;
	const from = document.getElementById('presetFrom').value;
	const to = document.getElementById('presetTo').value;
	const resultDiv = document.getElementById('presetResult');

	try {
		const result = quickConvert(value, from, to);
		resultDiv.className = 'result';
		resultDiv.innerHTML = `<span class="success">✓</span> ${value} (${from}) → ${result.toString()} (${to})`;
		resultDiv.style.display = 'block';
	} catch (e) {
		resultDiv.className = 'result error';
		resultDiv.innerHTML = `Error: ${e.message}`;
		resultDiv.style.display = 'block';
	}
}

function runTests() {
	const tests = [
		{input: '100 N', system: 'mmkgms', expected: 0.1, tolerance: 0.001},
		{input: '100 N', system: 'CGS', expected: 10000000, tolerance: 1},
		{input: '1 kg', system: 'CGS', expected: 1000, tolerance: 0.01},
		{input: '1 m', system: 'CGS', expected: 100, tolerance: 0.01},
		{input: '50 m/s', system: 'mmkgms', expected: 50, tolerance: 0.01},
		{input: '1 J', system: 'CGS', expected: 10000000, tolerance: 1},
		{input: '1000 kg', system: 'Imperial', expected: 2204.62, tolerance: 1},
		{input: '1 m', system: 'FPS', expected: 3.28084, tolerance: 0.01},
		{input: '1 Pa', system: 'CGS', expected: 10, tolerance: 0.1},
		{input: '1 Hz', system: 'SI', expected: 1, tolerance: 0.001},
	];

	let passed = 0;
	let failed = 0;
	let results = [];

	for (const test of tests) {
		try {
			const preset = PRESETS[test.system];
			const converter = new UniUnitSystem(preset);
			const result = converter.convert(test.input);
			const diff = Math.abs(result.value - test.expected);
			
			if (diff <= test.tolerance) {
				passed++;
				results.push(`<span class="success">✓</span> ${test.input} → ${test.system}: ${result.value} (expected ${test.expected})`);
			} else {
				failed++;
				results.push(`<span style="color:#c53030">✗</span> ${test.input} → ${test.system}: ${result.value} (expected ${test.expected}, diff ${diff.toFixed(6)})`);
			}
		} catch (e) {
			failed++;
			results.push(`<span style="color:#c53030">✗</span> ${test.input} → ${test.system}: Error: ${e.message}`);
		}
	}

	const resultDiv = document.getElementById('testResult');
	resultDiv.className = 'result';
	resultDiv.innerHTML = `<strong>Test Results: ${passed}/${tests.length} passed</strong><br><br>` + results.join('<br>');
	resultDiv.style.display = 'block';
}
</script>
</body>
</html>
